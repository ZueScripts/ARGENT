<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="atm.css">
</head>
<body>
    <div class="setup">

        <h1>ARGENT</h1>
        <p>Account Setup</p>
        <form id="setup_form">
            <div class="details">
                <label id="name_label" for="name">Enter your full name:</label>
                <input type="text" id="name">
            </div>

            <div class="details">
                <label id="pin_label" for="pin">Create PIN:</label>
                <input type="password" min="0" id="pin">
            </div>
            
            <button type="submit" class="button2">Submit →</button>
        </form>
    </div>
<script src="atm.js"></script>
</body>
</html>
